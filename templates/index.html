<!doctype html>
<html lang="en" data-theme="light" data-scale="medium">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Toronto Public Library branches, annual activity, services, programs and connected context.">
  <meta name="theme-color" content="#f4f6f7">
  <title>{{ title }} · LibraryTO</title>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap" data-inter-font onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap"></noscript>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}?v={{ static_version }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/graph-enhancements.css') }}?v={{ static_version }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="/">LibraryTO</a>
      <nav class="primary-nav" aria-label="Main">
        <a href="/" class="nav-link {% if active == 'overview' %}active{% endif %}" {% if active == 'overview' %}aria-current="page"{% endif %}>Overview</a>
        <a href="/branch-insights" class="nav-link {% if active == 'branches' %}active{% endif %}" {% if active == 'branches' %}aria-current="page"{% endif %}>Branch Insights</a>
        <a href="/comparisons" class="nav-link {% if active == 'comparisons' %}active{% endif %}" {% if active == 'comparisons' %}aria-current="page"{% endif %}>Branch Comparisons</a>
        <a href="/programs-events" class="nav-link {% if active == 'events' %}active{% endif %}" {% if active == 'events' %}aria-current="page"{% endif %}>Programs &amp; Events</a>
        <a href="/graph-explorer" class="nav-link {% if active == 'graph' %}active{% endif %}" {% if active == 'graph' %}aria-current="page"{% endif %}>Graph Explorer</a>
      </nav>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <a class="mobile-brand" href="/">LibraryTO</a>
        <div class="global-search">
          <label class="visually-hidden" for="global-search">Search branches and programs</label>
          <input id="global-search" type="search" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" placeholder="Search branches, services and programs" autocomplete="off" aria-controls="search-results" aria-expanded="false">
          <div id="search-results" class="search-results" role="listbox" aria-label="Search suggestions" hidden></div>
        </div>
        <div class="settings" aria-label="Display settings">
          <button id="theme-toggle" class="text-button" type="button" aria-label="Switch to dark mode">Dark mode</button>
          <label class="visually-hidden" for="font-scale">Text and interface size</label>
          <select id="font-scale" aria-label="Text and interface size">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
      </header>

      <main id="main" class="content" data-page="{{ active }}" data-cache-version="{{ static_version }}-{{ data_revision }}">
        <div class="page-heading">
          <div>
            <h1>{{ title }}</h1>
            <p class="page-description" id="page-description"></p>
          </div>
        </div>
        <section id="page-content" aria-busy="true">
          {% if active == 'branches' %}
          <div class="loading-state" role="status"><span class="loading-spinner" aria-hidden="true"></span><span>Loading branch directory…</span></div>
          {% else %}
          <p class="loading-line">Loading LibraryTO…</p>
          {% endif %}
        </section>
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', path='/js/app.js') }}?v={{ static_version }}" defer></script>
  <script src="{{ url_for('static', path='/js/graph-enhancements.js') }}?v={{ static_version }}" defer></script>
</body>
</html>
