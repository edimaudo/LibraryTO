<!doctype html>
<html lang="en" data-theme="light" data-scale="medium">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · LibraryTO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    (() => {
      try {
        const root = document.documentElement;
        const theme = localStorage.getItem('libraryto-theme');
        const scale = localStorage.getItem('libraryto-scale');
        const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = theme || (dark ? 'dark' : 'light');
        root.dataset.scale = ['small', 'medium', 'large'].includes(scale) ? scale : 'medium';
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <main class="error-page">
    <section class="error-content" aria-labelledby="error-title">
      <p class="error-code" aria-label="Error 404">404</p>
      <h1 id="error-title">Page not found</h1>
      <p>The address may be incorrect, or the page may have moved.</p>
      <div class="error-actions"><a class="primary" href="/">Go to Overview</a><a href="/branch-insights">Branch Insights</a></div>
    </section>
  </main>
</body>
</html>
